packages:
  - apps/*
  - packages/*

# Prefer catalog versions on `pnpm add` when a package is listed; still allow
# one-off deps that are not in the catalog (escalate to `strict` later if desired).
catalogMode: prefer

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@cloudflare/vite-plugin': ^1.54.11
  '@cloudflare/vitest-plugin': ^1.1.11
  '@hono/zod-validator': ^0.9.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/react-devtools': ^0.10.12
  '@tanstack/react-query': ^5.103.1
  '@tanstack/react-query-devtools': ^5.103.1
  '@tanstack/react-router': ^1.170.38
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/router-cli': 1.167.38
  '@tanstack/router-plugin': ^1.168.40
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': 26.6.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/devtools': ^0.7.5
  '@vitejs/devtools-oxc': ^0.7.5
  '@vitejs/devtools-rolldown': ^0.7.5
  '@vitejs/devtools-vite': ^0.7.5
  '@vitejs/devtools-vitest': ^0.7.5
  '@vitest/ui': ^5.0.1
  '@vitejs/plugin-react': ^6.1.1
  cross-env: ^10.1.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  happy-dom: ^20.14.5
  hono: ^4.13.8
  knip: ^6.36.0
  oxc-transform-react: ^0.150.0
  oxfmt: ^0.68.0
  oxlint: ^1.83.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.3.0
  react-dom: ^19.3.0
  rollup-plugin-visualizer: ^7.1.1
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  turbo: 2.10.13
  typescript: ^7.0.2
  vite: ^8.3.0
  vite-plus: 0.3.2
  vitest: ^5.0.1
  wrangler: ^4.127.1
  zod: ^4.5.4

auditConfig:
  ignoreCves: []
  ignoreGhsas: []

minimumReleaseAge: 480

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - wrangler
  - miniflare
  - typescript

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 365 days — skip trust checks for older publishes lacking provenance

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Fail closed when a dependency outside allowBuilds attempts an install script.
strictDepBuilds: true
