packages:
  - apps/*
  - packages/*

catalogMode: prefer
catalogPrune: true

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@cloudflare/vite-plugin': 2.0.0-beta.v.6
  '@cloudflare/vitest-plugin': ^1.4.9
  '@hono/cli': 1.0.0-rc.8
  '@hono/zod-validator': ^0.9.1
  '@playwright/cli': ^0.1.22
  '@sentry/cli': ^3.8.2
  '@sentry/cloudflare': 11.9.0
  '@sentry/hono': 11.9.0
  '@sentry/react': 11.9.0
  '@sentry/vite-plugin': 11.9.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/eslint-plugin-query': ^5.105.0
  '@tanstack/react-devtools': ^0.10.13
  '@tanstack/react-query': ^5.105.0
  '@tanstack/react-query-devtools': ^5.105.0
  '@tanstack/react-router': ^1.170.46
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/router-cli': 1.167.46
  '@tanstack/router-plugin': ^1.168.48
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': 26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/devtools': ^0.8.0
  '@vitejs/devtools-oxc': ^0.8.0
  '@vitejs/devtools-rolldown': ^0.8.0
  '@vitejs/devtools-vite': ^0.8.0
  '@vitejs/devtools-vitest': ^0.8.0
  '@vitest/ui': ^5.0.5
  '@vitejs/plugin-react': ^6.1.2
  cf: 1.0.0-beta.24
  cspell: ^10.4.0
  eslint-plugin-better-tailwindcss: ^4.10.0
  happy-dom: ^21.0.4
  hono: ^4.13.14
  jscpd: ^5.4.2
  knip: ^6.43.0
  oxc-transform-react: ^0.156.0
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  oxlint-plugin-react-doctor: ^0.9.18
  oxlint-tsgolint: ^7.0.2005
  react: ^19.3.1
  react-doctor: ^0.9.18
  react-dom: ^19.3.1
  rollup-plugin-visualizer: ^7.1.1
  skills: ^1.7.4
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  turbo: 2.11.10
  typescript: ^7.0.2
  vite: ^8.3.5
  vite-plus: ^1.4.0
  vitest: ^5.0.5
  wrangler: ^4.154.0
  zod: ^4.6.7

# Transitive '*' ranges would otherwise pull the newest @types/node major, ahead of the Node 26 engine.
overrides:
  '@types/node': 'catalog:'

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - cf
  - wrangler
  - miniflare
  - typescript

blockExoticSubdeps: true

# Keeps the pnpm pin document out of pnpm-lock.yaml: GitHub's dependency graph reads only the
# first YAML document (dependabot-core#15904). Remove when that issue closes.
pmOnFail: ignore

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # minutes (365 days)

permissions:
  '@playwright/cli':
    skills: true
  # The binary comes from the per-platform optionalDependencies; the postinstall
  # is only a download fallback.
  '@sentry/cli':
    build: false
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  esbuild:
    build: true
  sharp:
    build: true
  workerd:
    build: true

# Not .claude/skills: the agent sandbox denies writes there, so every agent-run
# install would fail. Claude entries are committed symlinks into .agents/skills.
skills:
  dirs:
    - .agents/skills

strictDepBuilds: true
