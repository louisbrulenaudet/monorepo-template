packages:
  - apps/*
  - packages/*

# Prefer catalog versions on `pnpm add` when a package is listed; still allow
# one-off deps that are not in the catalog (escalate to `strict` later if desired).
catalogMode: prefer

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  # 1.58.0 replaces `server.config` with a copy, which breaks Vite's inline-module
  # HTML proxy cache in dev ("No matching HTML proxy module"). Unpin once fixed upstream.
  '@cloudflare/vite-plugin': 1.57.3
  '@cloudflare/vitest-plugin': ^1.2.3
  '@hono/cli': 0.2.0-next.0
  '@hono/zod-validator': ^0.9.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/react-devtools': ^0.10.12
  '@tanstack/react-query': ^5.103.2
  '@tanstack/react-query-devtools': ^5.103.2
  '@tanstack/react-router': ^1.170.38
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/router-cli': 1.167.38
  '@tanstack/router-plugin': ^1.168.40
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': 26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/devtools': ^0.7.5
  '@vitejs/devtools-oxc': ^0.7.5
  '@vitejs/devtools-rolldown': ^0.7.5
  '@vitejs/devtools-vite': ^0.7.5
  '@vitejs/devtools-vitest': ^0.7.5
  '@vitest/ui': ^5.0.1
  '@vitejs/plugin-react': ^6.1.1
  cross-env: ^10.1.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  happy-dom: ^20.14.5
  hono: ^4.13.8
  knip: ^6.37.0
  oxc-transform-react: ^0.151.0
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  oxlint-plugin-react-doctor: ^0.9.14
  oxlint-tsgolint: ^7.0.2002
  react: ^19.3.0
  react-doctor: ^0.9.14
  react-dom: ^19.3.0
  rollup-plugin-visualizer: ^7.1.1
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  turbo: 2.11.3
  typescript: ^7.0.2
  vite: ^8.3.0
  vite-plus: 1.0.0-rc.0
  vitest: ^5.0.1
  wrangler: ^4.137.0
  zod: ^4.6.5

# Temporary transition group: @cloudflare/vitest-plugin still pins vitest ^4.1.0
# (workers-sdk has no v5-compatible release yet). Workers apps stay here until
# Cloudflare ships v5 support, then move back to `catalog:` and this is deleted.
catalogs:
  vitest4:
    vitest: ^4.1.11

auditConfig:
  ignoreCves: []
  ignoreGhsas: []

minimumReleaseAge: 480

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - wrangler
  - miniflare
  - typescript
  - '@hono/cli@0.2.0-next.0'

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 365 days - skip trust checks for older publishes lacking provenance

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Fail closed when a dependency outside allowBuilds attempts an install script.
strictDepBuilds: true
