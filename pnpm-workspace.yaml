packages:
  - apps/*
  - packages/*

# Prefer catalog versions on `pnpm add` when a package is listed; still allow
# one-off deps that are not in the catalog (escalate to `strict` later if desired).
catalogMode: prefer

catalog:
  '@cloudflare/vite-plugin': ^1.52.1
  '@cloudflare/vitest-pool-workers': ^0.21.3
  '@rolldown/plugin-babel': ^0.2.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.3
  '@tanstack/react-devtools': ^0.10.10
  '@tanstack/react-query': ^5.101.4
  '@tanstack/react-query-devtools': ^5.101.4
  '@tanstack/react-router': ^1.170.28
  '@tanstack/react-router-devtools': ^1.167.1
  '@tanstack/router-cli': 1.167.29
  '@tanstack/router-plugin': ^1.168.31
  '@types/node': 26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  babel-plugin-react-compiler: ^1.0.0
  cross-env: ^10.1.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  git-format-staged: ^4.0.2
  hono: ^4.13.2
  husky: ^9.1.7
  oxfmt: ^0.63.0
  oxlint: ^1.78.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.2.8
  react-dom: ^19.2.8
  rollup-plugin-visualizer: ^7.1.1
  tailwindcss: ^4.3.3
  turbo: ^2.10.9
  typescript: ^7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10
  wrangler: ^4.123.0
  zod: ^4.4.3

auditConfig:
  ignoreCves: []
  ignoreGhsas: []

minimumReleaseAge: 480

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - wrangler
  - miniflare
  - typescript

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 365 days — skip trust checks for older publishes lacking provenance

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Fail closed when a dependency outside allowBuilds attempts an install script.
strictDepBuilds: true
