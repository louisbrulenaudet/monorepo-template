packages:
  - apps/*
  - packages/*

catalog:
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  oxlint-tsgolint: ^7.0.2001
  typescript: ^7.0.2
  tailwindcss: ^4.3.3
  zod: ^4.4.3

auditConfig:
  ignoreCves: []
  ignoreGhsas: []

minimumReleaseAge: 480

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - wrangler
  - miniflare
  - typescript

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 365 days — skip trust checks for older publishes lacking provenance

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
