  '@cloudflare/vitest-plugin': ^1.4.3
  '@hono/cli': 0.2.0-next.9
  '@hono/zod-validator': ^0.9.1
  '@playwright/cli': ^0.1.22
  '@sentry/cli': ^3.8.0
  '@sentry/cloudflare': 11.7.0
  '@sentry/hono': 11.7.0
  '@sentry/react': 11.7.0
  '@sentry/vite-plugin': ^5.4.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/react-devtools': ^0.10.13
  '@tanstack/react-query': ^5.104.2
  '@tanstack/react-query-devtools': ^5.104.2
  '@tanstack/react-router': ^1.170.44
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/router-cli': 1.167.44
  '@tanstack/router-plugin': ^1.168.46
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': 26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/devtools': ^0.8.0
  '@vitejs/devtools-oxc': ^0.8.0
  '@vitejs/devtools-rolldown': ^0.8.0
  '@vitejs/devtools-vite': ^0.8.0
  '@vitejs/devtools-vitest': ^0.8.0
  '@vitest/ui': ^5.0.4
  '@vitejs/plugin-react': ^6.1.2
  cf: 1.0.0-beta.17
  cross-env: ^10.1.0
  cspell: ^10.4.0
  eslint-plugin-better-tailwindcss: ^4.9.1
  happy-dom: ^21.0.1
  hono: ^4.13.13
  jscpd: ^5.4.1
  knip: ^6.41.0
  oxc-transform-react: ^0.154.0
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  oxlint-plugin-react-doctor: ^0.9.18
  oxlint-tsgolint: ^7.0.2004
  react: ^19.3.1
  react-doctor: ^0.9.18
  react-dom: ^19.3.1
  rollup-plugin-visualizer: ^7.1.1
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  turbo: 2.11.8
  typescript: ^7.0.2
  vite: ^8.3.4
  vite-plus: ^1.2.0
  vitest: ^5.0.4
  wrangler: ^4.151.0
  zod: ^4.6.7

# Transitive '*' ranges would otherwise pull the newest @types/node major, ahead of the Node 24 engine.
overrides:
  '@types/node': 'catalog:'

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - cf
  - wrangler
  - miniflare
  - typescript
  - '@hono/cli@0.2.0-next.9'

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # minutes (365 days)

allowBuilds:
  # The binary comes from the per-platform optionalDependencies; the postinstall
  # is only a download fallback.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  workerd: true

strictDepBuilds: true
