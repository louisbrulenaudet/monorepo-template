  '@hono/cli': 0.2.0-next.9
  '@hono/zod-validator': ^0.9.1
  '@playwright/cli': ^0.1.22
  '@sentry/cli': ^3.8.0
  '@sentry/cloudflare': 11.1.0
  '@sentry/hono': 11.1.0
  '@sentry/react': 11.1.0
  '@sentry/vite-plugin': ^5.4.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/react-devtools': ^0.10.13
  '@tanstack/react-query': ^5.104.0
  '@tanstack/react-query-devtools': ^5.104.0
  '@tanstack/react-router': ^1.170.40
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/router-cli': 1.167.39
  '@tanstack/router-plugin': ^1.168.41
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': 26.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/devtools': ^0.7.6
  '@vitejs/devtools-oxc': ^0.7.6
  '@vitejs/devtools-rolldown': ^0.7.6
  '@vitejs/devtools-vite': ^0.7.6
  '@vitejs/devtools-vitest': ^0.7.6
  '@vitest/ui': ^5.0.2
  '@vitejs/plugin-react': ^6.1.1
  cf: 1.0.0-beta.6
  cross-env: ^10.1.0
  cspell: ^10.3.5
  eslint-plugin-better-tailwindcss: ^4.7.0
  happy-dom: ^20.14.5
  hono: ^4.13.11
  jscpd: ^5.3.3
  knip: ^6.38.0
  oxc-transform-react: ^0.152.0
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-plugin-react-doctor: ^0.9.14
  oxlint-tsgolint: ^7.0.2003
  react: ^19.3.0
  react-doctor: ^0.9.14
  react-dom: ^19.3.0
  rollup-plugin-visualizer: ^7.1.1
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  turbo: 2.11.5
  typescript: ^7.0.2
  vite: ^8.3.1
  vite-plus: ^1.0.0
  vitest: ^5.0.2
  wrangler: ^4.145.0
  zod: ^4.6.5

# Temporary: @cloudflare/vitest-plugin still pins vitest ^4.1.0. Once it supports v5,
# move the Workers apps back to `catalog:` and delete this group.
catalogs:
  vitest4:
    vitest: ^4.1.11

# Transitive @types/node '*' ranges would otherwise resolve to the newest major, ahead of the Node 24 engine.
overrides:
  '@types/node': 'catalog:'
  # Temporary: cf 1.0.0-beta.5 pins miniflare 5.20260926.0-alpha, which pins undici 7.29.0
  # (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3). Delete once cf ships on miniflare >= 5.20260926.1-alpha.
  'undici@>=7.0.0 <7.29.1': ^7.29.1

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - cf
  - wrangler
  - miniflare
  - typescript
  - '@hono/cli@0.2.0-next.9'
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0
  - workerd@1.20260930.2

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 365 days - skip trust checks for older publishes lacking provenance

allowBuilds:
  # The binary comes from the per-platform optionalDependencies; the postinstall
  # is only a download fallback.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  workerd: true

strictDepBuilds: true
