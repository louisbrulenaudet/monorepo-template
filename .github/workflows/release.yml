name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false
  # Not the default `single`, under which a third push replaces the pending run and
  # that release is silently dropped.
  queue: max

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Runs in both modes. While a release PR is open the mode is always `version`, so a
  # gate placed only on the release path would leave main unvalidated for its whole life.
  gate:
    name: Validate main
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  select-mode:
    name: Detect changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Open release PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - id: version
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore: release"
        env:
          # Not for the action, which uses its own `github-token` input - this is read by
          # @changesets/changelog-github inside the `changeset version` child process.
          GITHUB_TOKEN: ${{ github.token }}

      # --edit-last --create-if-none keeps this to one comment across the many times this
      # job re-runs while the release PR is open.
      - name: Correct the release PR contract
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file - <<'BODY'
          ### What merging this PR does

          **No npm publish happens.** Every workspace in this repo is `private: true`; there is
          no `publishConfig` and no registry configured. Disregard the "published to npm
          automatically" line in the description above.

          Merging this PR:

          1. lands the version bumps and `CHANGELOG.md` entries on `main`;
          2. makes the `Release` workflow validate that commit with full-graph CI;
          3. cuts the tag `v<version>` at it - the single release coordinate for both apps;
          4. hands that tag to `CD`, which uploads and promotes both Workers to 100%.

          Do not push edits to `changeset-release/main`: this branch is reset from the `main`
          tip and force-pushed on every push to `main`, so the commit would be discarded.
          Corrections belong in a new changeset on `main`.
          BODY

  tag:
    name: Tag release
    needs: [select-mode, gate]
    if: needs.select-mode.outputs.mode != 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: tag
        uses: ./.github/actions/create-release-tag

  # `created` is false when the tag already existed, so re-running never re-deploys.
  # Redeploy an existing tag with cd.yml's workflow_dispatch.
  # CD_ENABLED gates production: set the repository variable to 'true' in the same act as
  # adding the `production` Environment secrets. Unset leaves this job `skipped`, which is
  # visible - a paused job inside cd.yml reported success to this caller instead.
  deploy:
    name: Deploy release
    needs: tag
    if: needs.tag.outputs.created == 'true' && vars.CD_ENABLED == 'true'
    permissions:
      contents: write
      deployments: write
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
