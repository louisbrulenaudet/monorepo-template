name: CI

on:
  # Unfiltered push is intentional: branch filters on a PR-only rewrite of
  # this workflow did not fire (main still has the old push-only triggers),
  # which left the ruleset check pending forever. pull_request covers PRs
  # once this lands on main; push covers branch heads in the meantime.
  push:
  pull_request:
  workflow_dispatch:

# Deny by default; every job re-grants exactly `contents: read`.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only - never a push to `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_UI: "false"

jobs:
  ci:
    name: Lint, typecheck, and build
    # Pinned, not `ubuntu-latest`; Dependabot does not manage runner labels.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      # Every `uses:` is pinned to a full-length commit SHA with the tag in a trailing comment, and
      # every checkout sets `persist-credentials: false`. Both are load-bearing.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--affected` diffs base..HEAD via git. A shallow checkout cannot
          # resolve that range, so Turborepo falls back to "everything changed".
          # Full history with blobless fetch keeps it correct and still fast.
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          # Default install is not `--frozen-lockfile`; keep reproducibility explicit.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Boundaries
            run: pnpm run boundaries

          - name: Lint
            run: pnpm run lint:check

          - name: Format
            run: pnpm run format:check

          - name: Typecheck
            run: |
              pnpm turbo run check-types --affected
              pnpm run types:check

      - name: Build
        env:
          VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
        run: pnpm turbo run build --affected

  # Stage 1: upload is not promote. Creates immutable versions only.
  # Never runs versions deploy or wrangler deploy. Promote is human-only.
  upload:
    name: Upload Worker versions
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Production SPA origin baked into front-app uploads (not the CI placeholder).
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      CD_AFFECTED_BASE: ${{ github.event.before }}
      CD_AFFECTED_HEAD: ${{ github.sha }}
      CD_SELECTION_OUT: dist/cd/selection.json
      CD_RELEASE_OUT: dist/cd/release.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for upload" >&2
            exit 1
          fi

      - name: Upload affected versions
        run: node scripts/cd/upload-affected.mjs

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage1-release-${{ github.sha }}
          path: |
            dist/cd/selection.json
            dist/cd/release.json
          if-no-files-found: warn
          retention-days: 30
