name: CI

on:
  # No `push:` - pushes to `main` run through release.yml's `gate`, which calls this
  # workflow, so a commit is never validated twice.
  pull_request:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_UI: "false"

jobs:
  ci:
    name: Lint, typecheck, test, and build
    # The version PR is validated by release.yml's `gate` on the merge commit, before
    # any tag is cut; skipping here avoids a permanently pending required check.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # Empty off PRs on purpose: the full-graph path needs no base, and
      # `github.event.before` is all-zeros on a new branch.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Must come from a step: `runner` / $RUNNER_TEMP is unavailable in workflow- and
      # job-level `env:`, and referencing it there makes the file unparseable.
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          # PR-only: the release gate must stay a pure function of the commit.
          - name: Dependency audit
            if: github.event_name == 'pull_request'
            run: pnpm run audit

          - name: Boundaries
            run: pnpm run boundaries

          - name: Lint
            run: pnpm run lint:ci

          - name: Format
            run: pnpm run format:check

          - name: Types check
            run: pnpm run types:check

          - name: Knip
            run: pnpm run knip && pnpm run knip:production

          - name: Syncpack
            run: pnpm run deps:check && pnpm run deps:format --check

          - name: Typecheck, test, and build (affected)
            if: github.event_name == 'pull_request'
            run: pnpm turbo run check-types test build --affected

          - name: Typecheck, test, and build (full graph)
            if: github.event_name != 'pull_request'
            run: pnpm turbo run check-types test build

      - name: Wrangler deploy dry-run
        run: pnpm turbo run deploy --filter=front-app -- --dry-run

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-build-${{ github.run_id }}
          path: |
            apps/*/dist/**
            .turbo/*.log
            apps/*/.turbo/*.log
          if-no-files-found: ignore
          retention-days: 7
