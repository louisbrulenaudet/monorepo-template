name: CI

on:
  # No `push:` - pushes to `main` run through release.yml's `gate`, which calls this
  # workflow, so a commit is never validated twice.
  pull_request:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"
  TURBO_UI: "false"

jobs:
  ci:
    name: Lint, typecheck, test, and build
    # The version PR gets this check from the run release.yml dispatches on its branch.
    # Bound to the bot's exact branch, or any PR could skip the check by naming its branch.
    if: ${{ !(github.head_ref == 'changeset-release/main' && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # Write-only off PRs: same-repo PR runs hold the token and signing key (signing is an
      # integrity check, not trust), so the release gate never replays an entry a PR wrote.
      TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:rw' || 'local:rw,remote:w' }}
      VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      # Must be a step: `runner` in workflow/job `env:` makes the file unparseable (ops/ci).
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate cf types
        run: pnpm run types

      - parallel:
          # PR-only: the release gate must stay a pure function of the commit.
          - name: Dependency audit
            if: github.event_name == 'pull_request'
            run: pnpm run audit

          - name: Boundaries
            run: pnpm run boundaries

          - name: Agent hooks
            run: pnpm run hooks:test

          - name: Lint
            run: pnpm run lint:ci

          - name: Format
            run: pnpm run format:check

          - name: Syncpack
            run: pnpm run deps:check && pnpm run deps:format:check

          - name: Changesets
            if: github.event_name == 'pull_request'
            env:
              GITHUB_TOKEN: ${{ github.token }}
              CHANGESET_ALLOW_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') && '1' || '' }}
              CHANGESET_SKIP_RUNTIME_DEPENDENCIES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && secrets.CHANGESET_BOT_TOKEN == '' && '1' || '' }}
            run: pnpm run release:check

          - name: Workflow security
            if: github.event_name == 'pull_request'
            uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
            with:
              advanced-security: false
              annotations: true

          - name: Typecheck, test, build, and deploy check (affected)
            if: github.event_name == 'pull_request'
            run: pnpm turbo run check-types test build deploy:check --affected --continue=dependencies-successful

          - name: Typecheck, test, build, and deploy check (full graph)
            if: github.event_name != 'pull_request'
            run: pnpm turbo run check-types test build deploy:check --continue=dependencies-successful

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-build-${{ github.run_id }}
          path: |
            apps/*/.cloudflare/output/**
            .turbo/*.log
            apps/*/.turbo/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
