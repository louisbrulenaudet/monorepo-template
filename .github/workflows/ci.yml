name: CI

on:
  # PRs are the gate for feature work. Pushes to `main` are validated by the
  # `gate` job in release.yml, which calls this workflow - so `push:` is
  # deliberately absent and main is never checked twice for one commit.
  pull_request:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
  workflow_dispatch:

# Deny by default; the CI job re-grants `contents: read` and `actions: write`
# (artifacts on failure only).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only - never a push to `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_UI: "false"

jobs:
  ci:
    name: Lint, typecheck, test, and build
    # The version PR is authored by GITHUB_TOKEN and its content is validated by
    # release.yml's `gate` on the merge commit, before any tag is cut. Skipping
    # here keeps it from sitting as a permanently pending required check.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    # Pinned, not `ubuntu-latest`; Dependabot does not manage runner labels.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Remote-cache artifact signing (turbo.json remoteCache.signature + longerSignatureKey).
      # Repo-level secret; must be >= 32 bytes and identical to local machines' value.
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # Only PRs run `--affected`; every other event checks the full graph, so no
      # base is needed (and `github.event.before` is all-zeros on a new branch).
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Within-job Node V8 bytecode cache; turbo passThroughEnv lists it (strict mode).
      # Must be set from a step: `runner` / $RUNNER_TEMP is unavailable in workflow-
      # and job-level `env:`, and referencing it there makes the file unparseable.
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm run audit

      # One turbo CLI for check-types/test/build (avoids oversubscribing the runner with
      # two concurrency:100% processes). OXC, boundaries, and types:check stay in parallel.
      - parallel:
          - name: Boundaries
            run: pnpm run boundaries

          - name: Lint
            run: pnpm run lint:ci

          - name: Format
            run: pnpm run format:check

          - name: Types check
            run: pnpm run types:check

          - name: Knip
            run: pnpm run knip && pnpm run knip:production

          - name: Syncpack
            run: pnpm run deps:check && pnpm run deps:format --check

          # PRs check what changed; the release gate and manual runs check everything.
          - name: Typecheck, test, and build (affected)
            if: github.event_name == 'pull_request'
            env:
              VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
            run: pnpm turbo run check-types test build --affected

          - name: Typecheck, test, and build (full graph)
            if: github.event_name != 'pull_request'
            env:
              VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
            run: pnpm turbo run check-types test build

      - name: Wrangler deploy dry-run
        env:
          VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
        run: pnpm turbo run deploy --filter=front-app -- --dry-run

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-build-${{ github.run_id }}
          path: |
            apps/*/dist/**
            .turbo/**
          if-no-files-found: ignore
          retention-days: 7
