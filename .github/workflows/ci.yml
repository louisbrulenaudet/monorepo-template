name: CI

on:
  # Unfiltered push is intentional: branch filters on a PR-only rewrite of
  # this workflow did not fire (main still has the old push-only triggers),
  # which left the ruleset check pending forever. pull_request covers PRs
  # once this lands on main; push covers branch heads in the meantime.
  push:
  pull_request:
  workflow_dispatch:

# Deny by default; the CI job re-grants `contents: read` and `actions: write`
# (artifacts on failure only).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only - never a push to `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_UI: "false"

jobs:
  ci:
    name: Lint, typecheck, test, and build
    # Pinned, not `ubuntu-latest`; Dependabot does not manage runner labels.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # actions/checkout materializes branches as origin/<name> only. Turbo reads
      # GITHUB_BASE_REF as a bare name ("main"), which is not a local revision -
      # without this, --affected falls back to "everything changed".
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

    steps:
      # Every `uses:` is pinned to a full-length commit SHA with the tag in a trailing comment, and
      # every checkout sets `persist-credentials: false`. Both are load-bearing.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--affected` diffs base..HEAD via git. A shallow checkout cannot
          # resolve that range, so Turborepo falls back to "everything changed".
          # Full history with blobless fetch keeps it correct and still fast.
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          # Default install is not `--frozen-lockfile`; keep reproducibility explicit.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm run audit

      # One turbo CLI for check-types/test/build (avoids oversubscribing the runner with
      # two concurrency:100% processes). OXC, boundaries, and types:check stay in parallel.
      - parallel:
          - name: Boundaries
            run: pnpm run boundaries

          - name: Lint
            run: pnpm run lint:check

          - name: Format
            run: pnpm run format:check

          - name: Types check
            run: pnpm run types:check

          - name: Typecheck, test, and build
            env:
              VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
            run: pnpm turbo run check-types test build --affected

      # front-app needs dist/ from the build step; worker-api build is already a dry-run.
      # No Cloudflare credentials required: --dry-run only bundles/validates Wrangler config.
      - name: Wrangler deploy dry-run
        env:
          VITE_API_BASE_URL: https://worker-api-ci.monorepo-template.workers.dev
        run: pnpm turbo run deploy --filter=front-app -- --dry-run

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-build-${{ github.run_id }}
          path: |
            apps/*/dist/**
            .turbo/**
          if-no-files-found: ignore
          retention-days: 7
