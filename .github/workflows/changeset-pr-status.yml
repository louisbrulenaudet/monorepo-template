name: Changeset PR status

on:
  # `pull_request`, not `pull_request_target`: the base-context trigger only earns its
  # risk when supporting forks, and the comment job cannot post on a fork PR anyway.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"

jobs:
  pr-status:
    name: Release plan
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      body: ${{ steps.comment.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the comment
        id: comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGESET_ALLOW_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') && '1' || '' }}
          CHANGESET_SKIP_RUNTIME_DEPENDENCIES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && secrets.CHANGESET_BOT_TOKEN == '' && '1' || '' }}
        run: pnpm exec node .github/actions/changesets/comment.mjs

  pr-comment:
    name: Comment
    needs: pr-status
    if: ${{ !cancelled() && needs.pr-status.outputs.body != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # changeset status comment
    steps:
      - uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ needs.pr-status.outputs.body }}
