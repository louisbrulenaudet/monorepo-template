name: CD

on:
  # No `push: tags:` - the release tag is created with GITHUB_TOKEN, and events from
  # that token do not start workflow runs, so a tag trigger would be dead code.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)"
        required: true
        type: string
    secrets:
      # Cloudflare credentials are absent on purpose: they live on the `production`
      # Environment, never passed in by a caller.
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to deploy (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: cd-production
  cancel-in-progress: false
  # Not the default `single`, under which a third trigger replaces the pending one
  # and that release is silently dropped.
  queue: max

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_UI: "false"

jobs:
  deploy:
    name: Deploy production Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.VITE_API_BASE_URL }}
    permissions:
      contents: write # GitHub Release
      deployments: write # deployment record for the `production` environment
    # Cloudflare and GitHub tokens are step-scoped below on purpose - install, build,
    # and smoke never see them.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      NODE_ENV: production
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve release version
        run: bash .github/actions/cd/resolve-release-version.sh

      - name: Require deploy inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/require-deploy-inputs.sh

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Must come from a step: `runner` / $RUNNER_TEMP is unavailable in workflow- and
      # job-level `env:`, and referencing it there makes the file unparseable.
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter='./apps/*'

      - name: Upload a version of every app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/upload-versions.sh

      - name: Promote every app @100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/promote-versions.sh

      - name: Smoke production health
        run: bash .github/actions/cd/smoke-versions.sh

      # GitHub creates the deployment record from the `environment:` above; only the
      # Release is ours to write.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/cd/create-github-release.sh
