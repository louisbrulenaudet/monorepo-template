name: CD

on:
  # No `push: tags:` - the release tag is created with GITHUB_TOKEN, and events from
  # that token do not start workflow runs, so a tag trigger would be dead code.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)"
        required: true
        type: string
    # No `secrets:` on purpose: Cloudflare credentials live on the `production`
    # Environment, and no Turbo token means the build never restores remote-cache
    # output that a PR run could have planted.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to deploy (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: cd-production
  cancel-in-progress: false
  # Not the default `single`, under which a third trigger replaces the pending one
  # and that release is silently dropped.
  queue: max

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"
  TURBO_UI: "false"

jobs:
  deploy:
    name: Deploy production Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.VITE_API_BASE_URL }}
    permissions:
      contents: write # GitHub Release
      deployments: write # deployment record for the `production` environment
    # Cloudflare and GitHub tokens are step-scoped below on purpose - install, build,
    # and smoke never see them.
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_APP_ENVIRONMENT: production
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      NODE_ENV: production
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified, so a same-named branch can never shadow the tag.
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          # Full history: `sentry:deploy` associates every commit since the previous release.
          fetch-depth: 0

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/actions/cd/resolve-release-version.sh

      - name: Require deploy inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/require-deploy-inputs.sh

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Must be a step: `runner` in workflow/job `env:` makes the file unparseable (ops/ci).
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # check-types is named explicitly because `build` does not depend on it, and this build
      # never sees the gate's cache. The trailing `...` adds the packages the apps ship.
      - run: pnpm turbo run check-types build --filter='./apps/*...'

      - name: Upload a version of every app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/upload-versions.sh

      # Before promote, so the new version's first errors already resolve. Non-fatal:
      # a Sentry outage must not block a release. Sentry project slugs = app names.
      - name: Upload source maps to Sentry
        if: ${{ vars.SENTRY_ORG != '' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: pnpm --filter='./apps/*' run --if-present sentry:sourcemaps

      - name: Promote every app @100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/cd/promote-versions.sh

      - name: Smoke production health
        run: bash .github/actions/cd/smoke-versions.sh

      # After smoke, not with the source maps: Sentry resolves a `Fixes <SHORT-ID>` issue
      # when set-commits links its commit to a release, so this must wait until the fix is live.
      - name: Mark Sentry releases deployed
        if: ${{ vars.SENTRY_ORG != '' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: pnpm --filter='./apps/*' run --if-present sentry:deploy

      # GitHub creates the deployment record from the `environment:` above; only the
      # Release is ours to write.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/cd/create-github-release.sh
