name: Preview

on:
  # Never `pull_request_target`: it would run this checkout with base-branch secrets.
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy Worker Previews
    # Paused until PREVIEWS_ENABLED is true. Fork and Dependabot PRs never get the
    # credentials, and the release PR is validated by release.yml instead.
    if: >-
      vars.PREVIEWS_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
    permissions:
      contents: read
      pull-requests: write # the Previews comment
    # Cloudflare and GitHub tokens are step-scoped below - install never sees them,
    # and deploy-previews.sh unsets them around every build.
    env:
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      # Must be a step: `runner` in workflow/job `env:` makes the file unparseable (ops/ci).
      - name: Enable Node compile cache
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Create or update every app's Preview
        id: previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash .github/actions/previews/deploy-previews.sh

      - name: Comment Preview URLs
        uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ steps.previews.outputs.body }}
          update-id: worker-previews

  cleanup:
    name: Delete Worker Previews
    if: >-
      vars.PREVIEWS_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Delete every app's Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/actions/previews/delete-previews.sh
