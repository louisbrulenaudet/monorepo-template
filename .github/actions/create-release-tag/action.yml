name: Create release tag
description: Tags HEAD vX.Y.Z with the shared app version; fails on version drift, skips when the tag exists.

outputs:
  version:
    description: "The shared app version (semver, no leading v)."
    value: ${{ steps.version.outputs.version }}
  tag:
    description: "The release tag (vX.Y.Z)."
    value: ${{ steps.tag.outputs.tag }}
  created:
    description: "'true' when this run created the tag, 'false' when it already existed."
    value: ${{ steps.tag.outputs.created }}

runs:
  using: composite
  steps:
    - name: Resolve release version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        api_version="$(node "${{ github.action_path }}/read-release-version.mjs")"
        echo "version=${api_version}" >> "$GITHUB_OUTPUT"

    - name: Tag released version
      id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        tag="v${VERSION}"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        if gh api "repos/${{ github.repository }}/git/ref/tags/${tag}" > /dev/null 2>&1; then
          echo "Tag ${tag} already exists; nothing to release."
          echo "created=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Creating tag ${tag} at ${GITHUB_SHA}"
        gh api "repos/${{ github.repository }}/git/refs" \
          -f "ref=refs/tags/${tag}" \
          -f "sha=${GITHUB_SHA}"
        echo "created=true" >> "$GITHUB_OUTPUT"
