name: Record release
description: Creates/updates the GitHub Release and Deployment for a production release.

inputs:
  tag:
    required: true
  version:
    required: true
  worker-api-version-id:
    required: true
  front-app-version-id:
    required: true
  url:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        VERSION: ${{ inputs.version }}
        WORKER_API_VERSION_ID: ${{ inputs.worker-api-version-id }}
        FRONT_APP_VERSION_ID: ${{ inputs.front-app-version-id }}
        URL: ${{ inputs.url }}
      run: |
        set -euo pipefail
        notes="$(mktemp)"
        {
          echo "Deployed \`worker-api\` and \`front-app\` @ \`${VERSION}\` to production."
          echo
          echo "- Commit: ${GITHUB_SHA}"
          echo "- worker-api version id: \`${WORKER_API_VERSION_ID}\`"
          echo "- front-app version id: \`${FRONT_APP_VERSION_ID}\`"
          echo "- URL: ${URL}"
          changelog="apps/worker-api/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            excerpt="$(
              awk -v ver="$VERSION" '
                $0 == "## " ver { flag = 1; next }
                /^## / && flag { exit }
                flag { print }
              ' "$changelog"
            )"
            [ -n "$excerpt" ] && { echo; echo "$excerpt"; }
          fi
        } > "$notes"

        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
        else
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
        fi

        repo="${{ github.repository }}"
        deployment_id="$(
          gh api "repos/${repo}/deployments" \
            -f "ref=${TAG}" \
            -f "environment=production" \
            -F "auto_merge=false" \
            --jq '.id'
        )"

        gh api "repos/${repo}/deployments?environment=production&per_page=100" --jq '.[].id' |
          while IFS= read -r old_id; do
            [ "$old_id" = "$deployment_id" ] && continue
            gh api "repos/${repo}/deployments/${old_id}/statuses" \
              -f "state=inactive" \
              -f "description=Superseded by ${TAG}" > /dev/null
          done

        gh api "repos/${repo}/deployments/${deployment_id}/statuses" \
          -f "state=success" \
          -f "environment_url=${URL}" \
          -f "description=Released ${TAG} to production" > /dev/null

        rm -f "$notes"
